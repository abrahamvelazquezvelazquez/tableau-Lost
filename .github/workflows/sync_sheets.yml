name: Sincronizar Google Sheets a Dashboard

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta cada hora de forma automática
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Ejecutar script de actualización
        run: python actualizar_datos.py

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add datos.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update datos.js desde Google Sheets" && git push)
