name: Actualizador Seguimiento CCM Lost

on:
  schedule:
    - cron: '0 * * * *'  # Se ejecuta cada 1 hora
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install gspread google-auth
      - name: Crear credenciales
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: printf '%s' "$GCP_CREDS" > credentials.json
      - run: python seguimiento_ccm_lost.py
