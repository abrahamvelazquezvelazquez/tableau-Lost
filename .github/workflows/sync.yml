name: Sync Google Sheets Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch CSV Data
        run: |
          curl -sL "https://docs.google.com/spreadsheets/d/e/2PACX-1vSe0y0fqWb5y35DD4RiNjOsp9QLviTfhr-abCrIBgwPvYhbc7nSACny60URb7XKPCH2il5OLN9uZuGJ/pub?gid=0&single=true&output=csv" -o datos.csv

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build datos.js & datos.json
        run: |
          python - << 'EOF'
          import csv
          import json

          records = []
          with open('datos.csv', mode='r', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  records.append(row)

          # Guarda datos.json
          with open('datos.json', 'w', encoding='utf-8') as f:
              json.dump(records, f, ensure_ascii=False, indent=2)

          # Guarda datos.js
          with open('datos.js', 'w', encoding='utf-8') as f:
              f.write('window.handleDataResponse(' + json.dumps(records, ensure_ascii=False) + ');')
          EOF

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos.json datos.js
          git commit -m "Auto-update datos.js & datos.json" || exit 0
          git push
